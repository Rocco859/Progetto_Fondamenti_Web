<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Scheletro</title>

        <style>

            /* =========================================
           RESET E STILI BASE (Stile Wireframe)
           ========================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
            /* Stili di base per il layout */
           body {
            /* Colori scuri per simulare lo schizzo */
            background-color: #8fbc8f;
            color: #3d3c3c;
            padding: 20px;
        }

           header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #ffffff;
            border-radius: 50px; /* Bordo arrotondato come nel disegno */
            padding: 15px 30px;
            margin-bottom: 40px;
        }

        header h1 {
            font-weight: normal;
            font-size: 24px;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        main {
            flex: 2; /* Prende 2/3 dello spazio */
            display: flex;
            flex-direction: column;
            align-items: center; /* Centra i blocchi orizzontalmente */
            gap: 50px;
            margin-top: 20px;
        }

            section {
                flex: 1;
                margin-right: 1em;
            }

            aside {
                width: 300px;
                background-color: #8fbc8f;
                padding: 1em;
            }

        </style>
    </head>

<body>
       
        <header>
            <h1>Nome app</h1>

            <nav>
                
            </nav>
        </header>

        <main>
            
            <section id="aggiungi-alimento">

            </section>

            <section id="azioni-principali">

                <article>FRIGO</article>
                <article>LISTA SPESA</article>

            </section>

        </main>

        <aside id="alimenti-in-scadenza">
            <h2>Alimenti in scadenza</h2>
        </asaide>

        <aside id="chatbot">
            <h2>Chatbot</h2>
        </aside>

    </body>
</html>
