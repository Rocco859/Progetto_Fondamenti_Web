<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Test Stile</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            body {
                background-color: #e2efe6; /* Verde acqua chiaro di sfondo */
                color: #234b31; /* Verde scuro elegante per i testi */
                padding: 40px;
                min-height: 100vh;
                display: grid;
                grid-template-columns: 1.5fr 1fr; /* Colonna sinistra più larga, colonna destra più stretta */
                grid-template-rows: auto 1fr; /* Riga alta in base al contenuto (header), riga sotto prende il resto */
                grid-template-areas: 
                "header header"
                "main sidebar";
                gap: 40px; /* Spazio tra i blocchi */
                max-width: 1400px;
                margin-inline: auto; /* Centra tutto nello schermo */
            }

            /* =========================================
       HEADER (Area "header" della griglia)
       ========================================= */

            header {
                grid-area: header;
                background-color: #ffffff;
                border-radius: 50px;
                padding: 15px 40px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            }

            .brand {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .logo-sito {
                width: 80px;  /* Puoi aumentare o diminuire questo valore per ingrandirlo/rimpicciolirlo */
                /*height: 50px;*/
                border-radius: 50%; /* Si assicura che il bordo rimanga un cerchio perfetto */
                object-fit: cover;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); /* Dona un leggero effetto 3D */
            }

            header h1 {
                font-size: 24px;
                font-weight: 700;
            }

            header nav {
                display: flex;
                align-items: center;
                gap: 30px;
            }

            .user-account {
                display: flex;
                align-items: center;
                gap: 12px;
                font-weight: 600;
            }

            .user-icon {
                display: inline-block;
                width: 35px;
                height: 35px;
                border: 2px solid #234b31;
                border-radius: 50%;
            }

            .menu-btn {
                background: none;
                border: none;
                font-size: 28px;
                color: #234b31;
                cursor: pointer;
            }

   /* =========================================
       MAIN (Area "main" della griglia)
       ========================================= */

            main {
                grid-area: main;
                display: flex;
                flex-direction: column;
                gap: 40px;
            }

            /* Barra stile Ricerca / Aggiungi */
            #Aggiungi-Alimento {
                background-color: #ffffff;
                border-radius: 50px;
                padding: 20px 40px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
                display: flex;
                align-items: center;
            }

           #Aggiungi-Alimento h2 {
                font-size: 16px;
                font-weight: 500;
                color: #6a8c75;
                text-transform: uppercase;
            } 

            /* Tasti Quadrati Centrali */
            #Tasti {
                display: flex;
                gap: 40px;
            }

            .card {
                flex: 1; /* Occupano lo stesso spazio orizzontale */
                aspect-ratio: 1; /* Li rende perfettamente quadrati */
                background-color: #fdfcf6; /* Bianco caldo/crema */
                border: 2px solid #e0c890; /* Bordo dorato morbido */
                border-radius: 25px;
                color: #234b31;
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.04);
                cursor: pointer;
                display: flex;
                justify-content: center;
                align-items: center;
                transition: transform 0.3s;
            }

            .card h2 {
                font-size: 20px;
                font-weight: 700;
            }

            .card:hover {
                transform: translateY(-5px);
            }

            /* =========================================
       SIDEBAR SCADENZE (Area "sidebar" della griglia)
       ========================================= */

            #sidebar-scadenza {
                grid-area: sidebar;
                background-color: #ffffff;
                border-radius: 30px;
                padding: 40px 30px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            }

            #sidebar-scadenza h2 {
                font-size: 16px;
                text-transform: uppercase;
                font-weight: 700;
                letter-spacing: 0.5px;
            }

            /* =========================================
       CHATBOT (Fisso in basso a sinistra)
       ========================================= */

            #chatbot-widget {
                position: fixed;
                bottom: 40px;
                left: 40px;
                z-index: 100;
            }

            .chatbot-btn {
                background-color: #3b6b4c; /* Verde scuro predominante */
                color: #ffffff;
                border: none;
                padding: 12px 25px 12px 12px;
                border-radius: 50px;
                display: flex;align-items: center;
                gap: 15px;
                font-weight: 600;
                font-size: 14px;
                box-shadow: 0 8px 20px rgba(59, 107, 76, 0.3);
                cursor: pointer;
                transition: transform 0.3s;
            }
            
            .chatbot-btn:hover {
                transform: scale(1.05);
            }

            .chatbot-icon {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                border: 2px solid #ffffff;
            }





           
            






            
        </style>
    </head>
    <body>

        <header>

            <div class="brand">
                 <img src="logo-fridgy.png" alt="Logo Fridgy" class="logo-sito">
                 <h1>Fridgy</h1>
            </div>
            
            <nav>
               
                <div class="user-account">
                    <span class="user-icon"></span>
                    <span class="username">User</span>
                </div>

                <button type="button" class="menu-btn">≡</button>
            </nav>
        </header>

        <main>
            <section id="Aggiungi-Alimento">
                <h2>Aggiungi alimento</h2>
            </section>

            <section id="Tasti">
                <button type="button" class="card">
                    <h2>IL TUO FRIGO</h2>
                </button>
                <button type="button" class="card">
                    <h2>LISTA SPESA</h2>
                </button>
            </section>
        </main>
        
        <aside id="sidebar-scadenza">
            <h2>ALimenti in scadenza</h2>
        </aside>

        <aside id="chatbot-widget">
            <button type="button" class="chatbot-btn">
                <div class="chatbot-icon"></div>
                <span>CHAT CON AI</span>
            </button>
        </aside>

    </body>
</html>
