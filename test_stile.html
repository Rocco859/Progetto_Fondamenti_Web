                display: grid;
                grid-template-columns: 1.5fr 1fr; /* Colonna sinistra più larga, colonna destra più stretta */

                "header header"
                "main sidebar";
                gap: 40px; /* Spazio tra i blocchi */
                max-width: 1400px;
                margin-inline: auto; /* Centra tutto nello schermo */
            }

            /* Tasti Quadrati Centrali */
            #Tasti {
                display: flex;
                gap: 40px;
            }

            .card {
                flex: 1; /* Occupano lo stesso spazio orizzontale */
                aspect-ratio: 1; /* Li rende perfettamente quadrati */
                background-color: #fdfcf6; /* Bianco caldo/crema */
                border: 2px solid #e0c890; /* Bordo dorato morbido */
                border-radius: 25px;
                color: #234b31;
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.04);
                cursor: pointer;
                display: flex;
                justify-content: center;
                align-items: center;
                transition: transform 0.3s;
            }

            .card h2 {
                font-size: 20px;
                font-weight: 700;
            }

            .card:hover {
                transform: translateY(-5px);
            }

            /* =========================================
       SIDEBAR SCADENZE (Area "sidebar" della griglia)
       ========================================= */

            #sidebar-scadenza {
                grid-area: sidebar;
                background-color: #ffffff;
                border-radius: 30px;
                padding: 40px 30px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            }

            #sidebar-scadenza h2 {
                font-size: 16px;
                text-transform: uppercase;
                font-weight: 700;
                letter-spacing: 0.5px;
            }

            /* =========================================
       CHATBOT (Fisso in basso a sinistra)
       ========================================= */

            #chatbot-widget {
                position: fixed;
                bottom: 40px;
                left: 40px;
                z-index: 100;
            }

            .chat-chiusa {
                display: none !important;
            }

            .chatbot-btn {
                background-color: #3b6b4c; /* Verde scuro predominante */
                color: #ffffff;
                border: none;
                padding: 12px 25px 12px 12px;
                border-radius: 50px;
                display: flex;align-items: center;
                gap: 15px;
                font-weight: 600;
                font-size: 14px;
                box-shadow: 0 8px 20px rgba(59, 107, 76, 0.3);
                cursor: pointer;
                transition: transform 0.3s;
            }
            
            .chatbot-btn:hover {
                transform: scale(1.05);
            }

            .chatbot-icon {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                border: 2px solid #ffffff;
            }

            #chat-window {
                background-color: #ffffff;
                border-radius: 20px;
                width: 400px;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                margin-bottom: 15px;
                height: 500px;
            }

            .chat-header{
                background-color: #3b6b4c;
                color: #ffffff;
                padding: 5px;
                height: 13%;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .chat-header h3 {
                font-size: 16px;
                font-weight: 600;
                margin-left: 10px;
                font-size: large;
            }


                .chat-body {
                    flex: 1;
                    padding: 15px;
                    overflow-y: auto;
                }
            .chat-footer {
                height: 10%;
                background-color: #f0f0f0;
                padding: 10px;
                display: flex;
                gap: 10px;
                align-items: center;
            }

            .chat-footer input {
                flex: 1;
                padding: 8px 12px;
                border-radius: 20px;
                border: 3px solid #3b6b4c;
            }

            .invia-messaggio {
                background-color: #3b6b4c;
                color: #ffffff;
                border: none;
                padding: 8px 16px;
                border-radius: 20px;                    
                font-weight: 600;
                    
            }
