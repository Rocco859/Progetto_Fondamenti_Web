<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fridgy</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <!-- ✅ React e Babel (via CDN, nessun build tool necessario) -->
        <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            body {
                background-color: #e2efe6;
                color: #234b31;
                padding: 40px;
                min-height: 100vh;
                display: grid;
                grid-template-columns: 1.5fr 1fr;
                grid-template-rows: auto 1fr;
                grid-template-areas: 
                "header header"
                "main sidebar";
                gap: 40px;
                max-width: 1400px;
                margin-inline: auto;
            }

            * { box-sizing: border-box; }

            nav {
                background-color:#fffaf0;
                border-radius: 50px;
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                margin: 10px;
                width: 100%;
            }
            .logo { color: #3d3c3c; display: flex; justify-content:left; border-left: 30px; }
            header { margin: 0; padding: 0; display: flex; align-items: center; grid-area: header; width: 100%; }
            .accesso-eff { display: flex; justify-content:right; flex-direction: row; gap: 10px; margin-right: 30px; }
            .section-dx { display: flex; justify-content:right; width: 100%; margin-right: 30px; flex-direction: row; }
            .sectionnolog-dx { display: flex; justify-content:space-between; margin-right: 30px; flex-direction: row; align-items: center; }
            .section-sx { display: flex; justify-content:left; margin-left: 30px; }
            .nomeutente { color: #3d3c3c; font-size: 18px; align-content: center; }
            .foto-circolare { width: 35px; height: 35px; border-radius: 50%; align-items: center; overflow: hidden; border: 2px solid #3d3c3c; }
            .btn-accedi { justify-content:right; color: #3d3c3c; display:flex; margin-right: 30px; margin-top: 6px; flex-direction: row; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; }
            .btn-hamburger { width: 40px; height: 30px; margin: 3px; }

            main { grid-area: main; display: flex; flex-direction: column; gap: 40px; }

            #Aggiungi-Alimento {
                background-color: #ffffff;
                border-radius: 50px;
                padding: 20px 40px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
                display: flex;
                align-items: center;
            }
            #Aggiungi-Alimento h2 { font-size: 16px; font-weight: 500; color: #6a8c75; text-transform: uppercase; }

            #Tasti { display: flex; gap: 40px; }

            .card {
                flex: 1;
                aspect-ratio: 1;
                background-color: #fdfcf6;
                border: 2px solid #e0c890;
                border-radius: 25px;
                color: #234b31;
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.04);
                cursor: pointer;
                display: flex;
                justify-content: center;
                align-items: center;
                transition: transform 0.3s;
            }
            .card h2 { font-size: 20px; font-weight: 700; }
            .card:hover { transform: translateY(-5px); }

            #sidebar-scadenza {
                grid-area: sidebar;
                background-color: #ffffff;
                border-radius: 30px;
                padding: 40px 30px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            }
            #sidebar-scadenza h2 { font-size: 16px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }

            /* ✅ Il vecchio #chatbot-widget statico è rimosso:
               ora è gestito interamente da React in chatbot.js */
        </style>
    </head>
    <body>

        <header>
            <nav>
                <div class="section-sx">
                    <section class="logo">
                        <h1>Fridgy</h1>
                    </section>
                </div>
                <div class="sectionnolog-dx">
                    <a class="btn-accedi">Accedi</a>
                    <a class="btn-accedi">Registrati</a>
                    <button class="btn-hamburger">☰</button>
                </div>
            </nav>
        </header>

        <main>
            <section id="Aggiungi-Alimento">
                <h2>Aggiungi alimento</h2>
            </section>
            <section id="Tasti">
                <button type="button" class="card">
                    <h2>IL TUO FRIGO</h2>
                </button>
                <button type="button" class="card">
                    <h2>LISTA SPESA</h2>
                </button>
            </section>
        </main>

        <aside id="sidebar-scadenza">
            <h2>Alimenti in scadenza</h2>
        </aside>

        <!-- ✅ Punto di mount per il componente React del chatbot -->
        <div id="chatbot-root"></div>

        <!-- ✅ Il file React separato, caricato con type="text/babel" -->
        <script type="text/babel" src="chatbot.js"></script>

    </body>
</html>
