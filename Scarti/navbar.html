}
.menu-tendina a,.menu-tendina-nolog a {
    color:  #3b6b4c;
    text-decoration: none; 
    padding: 15px 20px;
    font-size: 14px;
    font-weight: bold;
   transition: all 0.3s ease;
}
.menu-tendina a:hover,.menu-tendina-nolog a:hover {
    background-color: #3b6b4c;
    color: #fffaf0;
      
}

     button{width: 40px; 
        height: 30px;
    margin: 3px;}
    .menu-tendina {
   
    position: absolute; 
    top: 90px; 
    right: 40px;
    margin-left: 100px; 
    
    background-color: #fffaf0; 
    border-radius: 15px; 
    border: 2px solid #3d3c3c; 
    width: 200px;
    height: 200px;
    opacity: 0;
    pointer-events: none;
    /* Trasla (sposta) la tendina verso l'alto di 20px rispetto alla sua posizione originale */
    transform: translateY(-20px); 
    
    /* Anima sia l'opacità che il movimento (transform) */
    transition: opacity 0.3s ease, transform 0.3s ease;
} 

  menu-tendina.aperta {
    opacity: 1;
    display: flex;
    justify-content:space-between;
    flex-direction: column;
    overflow: hidden; 
    transform: translateY(0);

}


.menu-tendina hr {
    margin: 0;
    border: none;
    border-top: 2px solid #3d3c3c; 
}
.testo-rosso {
    color: #d32f2f !important; 
}
.logreg-popup{
    background-color: #fffaf0;
    border-radius: 15px;
    border: 2px solid #3d3c3c;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    width: 40%;
    position: absolute;

}
.overlay
{
    background-color: rgba(41, 41, 41, 0.7);
    width: 100%;
    height: 100%;
    position: fixed;
    top: 0;
    left: 0;
    display: flex;
    justify-content: center;    
    align-items: center;
    opacity: 0;            
    pointer-events: none;  
    transition: opacity 0.4s ease;
}
.overlay.open {
    opacity: 1;           /* Torna visibile */
    pointer-events: auto; /* Torna cliccabile e blocca lo sfondo */
}
.input-logreg
{
    width: 100%;
    padding: 10px;

.btn-logreg

.btn-logreg:hover

ul {

    padding: 0;            /* Rimuove lo spazio vuoto a sinistra che il browser mette di default per il pallino */
    margin: 0;             /* Rimuove eventuali margini automatici */
}
