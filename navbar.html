<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fridgy - La tua Dispensa</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
        box-sizing: border-box; 
    }

        nav {
            background-color:#fffaf0;
            border-radius: 50px;
    
           
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            margin: 10px;
            width: 100%;
        
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #8fbc8f;
        }
        .logo
        {
            color: #3d3c3c;
            display: flex;
            justify-content:left;
            border-left: 30px;
        }
        header
        {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            
        }
        .accesso-eff
        {
            display: flex;
            justify-content:right;
              display: flex;
            flex-direction: row;
            gap: 10px;
            margin-right: 30px;
        }
        .section-dx
        {
            display: flex;
            justify-content:right;
            width: 100%;
            margin-right: 30px;
            flex-direction: row;
        }
        .sectionnolog-dx
        {
            display: flex;
            justify-content:space-between;
            margin-right: 30px;
            flex-direction: row;
        }
        
        .section-sx
        {
            display: flex;
            justify-content:left;
            margin-left: 30px;
        }
        .nomeutente
        {
            color: #3d3c3c;
            font-size: 18px;
            align-content: center;
        }
        .foto-circolare {
    width: 35px; 
    height: 35px;
    border-radius: 50%; 
    align-items: center;
    overflow: hidden; 
    border: 2px solid #3d3c3c; 
}
.btn-accedi {
    justify-content:right;
color: #3d3c3c;
    display:flex;
    margin-right: 30px;
    margin-top: 6px;
    flex-direction: row;
    align-content: right;  
    font-size: 16px;
    font-weight: bold;
    cursor: pointer; /* Manina al passaggio del mouse */
    transition: all 0.3s ease; /* Rende il cambio di colore fluido */
}

     button{width: 40px; 
        height: 30px;
    margin: 3px;}

    </style>

</head>
<body>
    <header>
    <nav>
        <div class="section-sx">
        <section class="logo">
            <h1>Fridgy</h1>
        </section>
        </div>






        <div class="sectionnolog-dx">
    
    <a class="btn-accedi">Accedi</a><a></a><a class="btn-accedi">Registrati</a>

    <button class="btn-hamburger">☰</button>

</div>
