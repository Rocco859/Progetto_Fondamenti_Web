#collegamento tra le tre cartelle

services:
  mongo:
    image: mongo:7
    container_name: fridgy-mongo

    ports: 
      - "27017:27017"
    
    #per la persistenza dei dati anche quando i container vengono eliminati
    volumes:
      - mongo-data:/data/db

    restart: unless-stopped

  backend:
    build: ./fridgy-backend
    container_name: fridgy-backend
    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - mongo

    restart: unless-stopped

  
  frontend:
    build:
      context: ./fridgy-app

      args: 
         VITE_API_URL: http://localhost

    container_name: fridgy-frontend

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend

    restart: unless-stopped


volumes:
   mongo-data:
    